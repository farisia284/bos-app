<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f0fdf4;color:#1a2e1a}
.top{position:sticky;top:0;z-index:100}
.hdr{background:linear-gradient(135deg,#166534,#14532d);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px #0004}
.logo{width:34px;height:34px;background:#CA8A04;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.yr{background:#ffffff26;border-radius:8px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:10px}

.sc b{font-size:15px}
label{font-size:12px;font-weight:600;color:#374151;margin:8px 0 3px;display:block}
input,select{width:100%;border:1.5px solid #d1fae5;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;outline:none}
input:focus,select:focus{border-color:#16a34a;box-shadow:0 0 0 3px #16a34a1a}

input[type=checkbox]{width:16px;height:16px}
select.auto,input.auto{width:auto;font-size:12px}
.btn{padding:9px 15px;border-radius:8px;border:0;font-weight:600;font-size:13px;background:#166534;color:#fff;cursor:pointer}
.btn:hover{opacity:.87}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:#CA8A04}.btn.red{background:#dc2626}.btn.blue{background:#0369a1}.btn.teal{background:#0f766e}.btn.gray{background:#f3f4f6;color:#374151}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px}

.info{background:#f0fdf4;border:1px solid #dcfce7;border-radius:8px;padding:8px 11px;font-size:12px;margin-bottom:8px}
.jt{padding:10px;border-radius:10px;font-weight:700;cursor:pointer;font-size:12px;background:#fff}
.bar{background:#f1f5f9;border-radius:99px;height:10px}
.bar i{display:block;height:10px;border-radius:99px;transition:width .5s}
.bd{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.wrap{overflow-x:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ib{background:none;border:0;cursor:pointer;font-size:13px;padding:2px 4px}
#toast{position:fixed;bottom:16px;right:16px;left:16px;max-width:420px;margin-left:auto;background:#1f2937;color:#fff;padding:10px 16px;border-radius:9px;z-index:99999;font-size:13px;font-weight:500;box-shadow:0 4px 14px #0004;display:none}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal>div{background:#fff;border-radius:13px;padding:22px;max-width:300px;width:100%}

/* ===== TEMA BARU (hanya tampilan layar; hasil cetak tidak berubah) ===== */
:root{--teal:#0f766e;--teal2:#14b8a6;--ink:#0f172a;--line:#e2e8f0}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);background:#eef4f2;background-image:radial-gradient(900px 420px at 85% -10%,#99f6e433,transparent 60%),radial-gradient(700px 380px at -10% 20%,#fde68a33,transparent 60%);background-attachment:fixed}
.top{background:linear-gradient(135deg,#064e3b 0%,#0f766e 55%,#14b8a6 100%);border-radius:0 0 26px 26px;box-shadow:0 14px 30px -14px #064e3bcc}
.hdr{background:none;box-shadow:none;padding:14px 18px 8px}
.logo{width:42px;height:42px;border-radius:14px;background:#ffffff26;border:1px solid #ffffff40;font-size:20px;backdrop-filter:blur(6px)}
.yr{background:#ffffff22;border:1px solid #ffffff38;border-radius:12px;padding:6px 10px}
main{padding:18px 14px 48px}
.card{border-radius:18px;border:1px solid #fff;box-shadow:0 1px 2px #0f172a0d,0 12px 28px -14px #0f172a30}
.ct{color:var(--ink);font-size:15px;font-weight:800}
.ct::before{content:'';display:inline-block;width:5px;height:15px;margin-right:8px;border-radius:3px;background:linear-gradient(#14b8a6,#0f766e);vertical-align:-2px}
.sc{position:relative;overflow:hidden;border-radius:18px;padding:16px 18px;box-shadow:0 14px 24px -14px #0009;background-image:linear-gradient(135deg,#ffffff33 0%,#00000026 100%)!important}
.sc::after{content:'';position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:#ffffff26}
.sc small{font-size:11px;font-weight:600;opacity:.92;letter-spacing:.3px}
.sc b{font-size:19px;font-weight:800;letter-spacing:-.3px;position:relative}
label{color:#475569;font-weight:700}
input,select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fafc;transition:.15s}
input:focus,select:focus{background:#fff;border-color:var(--teal2);box-shadow:0 0 0 4px #14b8a62e}
input[type=checkbox]{accent-color:var(--teal)}
input[type=file]::file-selector-button{border:0;background:#ccfbf1;color:var(--teal);padding:6px 12px;border-radius:8px;font-weight:700;margin-right:10px;cursor:pointer}
.btn{border-radius:12px;padding:10px 16px;font-weight:700;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 8px 16px -8px #0f766eaa;transition:.15s}
.btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 12px 20px -8px #0f766ecc}
.btn:active{transform:none}
.btn.gold{background:linear-gradient(135deg,#d97706,#f59e0b);box-shadow:0 8px 16px -8px #d97706aa}
.btn.red{background:linear-gradient(135deg,#dc2626,#f87171);box-shadow:0 8px 16px -8px #dc2626aa}
.btn.blue{background:linear-gradient(135deg,#0369a1,#38bdf8);box-shadow:0 8px 16px -8px #0369a1aa}
.btn.teal{background:linear-gradient(135deg,#0f766e,#2dd4bf);box-shadow:0 8px 16px -8px #0f766eaa}
.btn.gray{background:#f1f5f9;color:#334155;box-shadow:none}
.btn:disabled{transform:none;box-shadow:none}
.jt{border-radius:14px;padding:12px 8px;transition:.15s}
.jt:hover{transform:translateY(-1px)}
.info{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0;border-radius:12px;color:#065f46;padding:10px 13px}
.tbx{background:#fffbeb;border:1px dashed #fcd34d;border-radius:10px;color:#92400e}
.bar{height:12px;background:#e2e8f0}
.bar i{height:12px;background-image:linear-gradient(90deg,#ffffff55,#0000)!important}
.bd{font-weight:700}
#toast{background:#0f172af2;border-radius:14px;box-shadow:0 16px 32px -12px #0008;backdrop-filter:blur(8px)}
.modal{background:#0f172a80;backdrop-filter:blur(4px)}
.modal>div{border-radius:22px;box-shadow:0 30px 60px -20px #0008}
.ib{transition:.15s}
.ib:hover{transform:scale(1.2)}
.login{max-width:400px;margin:0 auto;padding:60px 16px}
.login .card{padding:34px 24px 24px;border-radius:26px;margin-top:20px}
.login .card>div:first-child{display:flex;align-items:center;justify-content:center;width:72px;height:72px;margin:-70px auto 14px;border-radius:22px;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 14px 26px -10px #0f766e;font-size:34px}
.login .ct::before{display:none}
@media print{body{background:#fff!important}}
/* ===== DASHBOARD BARU ===== */
.dg{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}
@media(max-width:700px){.dg{grid-template-columns:1fr}}
.dg .card{margin-bottom:11px}
.al{padding:9px 12px;margin-bottom:6px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;font-size:13px;cursor:pointer}
.al b{color:#92400e;white-space:nowrap}
.mchart{display:flex;gap:3px;align-items:flex-end}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.mb{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.mb i{width:44%;max-width:14px;border-radius:4px 4px 0 0}
.mc span{font-size:9px;color:#64748b;margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* ===== GRAFIK: animasi, hover, tooltip ===== */
@keyframes rise{from{transform:scaleY(0)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes sweep{from{stroke-dasharray:0 100}}
.mb i{transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms);transition:filter .15s}
.mc{cursor:pointer;border-radius:8px;padding:2px 0;transition:background .15s}
.mc:hover{background:#0f766e14}.mc:hover .mb i{filter:brightness(1.15)}
.bar i{transform-origin:left;animation:fill .8s cubic-bezier(.2,.8,.2,1) both}
.dnw{position:relative;width:170px;height:170px;margin:auto}
.dn{width:170px;height:170px;transform:rotate(-90deg);overflow:visible}
.dn circle{fill:none;stroke-width:5;cursor:pointer;animation:sweep .9s ease both;transition:stroke-width .15s}
.dn circle:hover{stroke-width:7}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dc small{font-size:9px;color:#64748b}.dc b{font-size:11px}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 5px;border-radius:7px;cursor:pointer;transition:background .15s}
.lg:hover{background:#f1f5f9}
.sc{transition:transform .15s}.sc:hover{transform:translateY(-2px)}
#tip{position:fixed;display:none;z-index:99998;background:#0f172af2;color:#fff;font-size:12px;line-height:1.5;padding:7px 11px;border-radius:10px;white-space:pre-line;pointer-events:none;box-shadow:0 10px 24px -8px #0008}
@media(prefers-reduced-motion:reduce){.mb i,.bar i,.dn circle{animation:none}}

/* ===== SIDEBAR ===== */
.shell{display:flex;min-height:100vh}
.mainc{flex:1;min-width:0}
.shell main{max-width:none}
.hdr{padding:14px 18px}
.sb{width:232px;flex-shrink:0;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#052e2b,#064e3b);color:#d1fae5;overflow:hidden;z-index:300;transition:width .25s cubic-bezier(.4,0,.2,1)}
.mini .sb{width:68px}
.sbh{display:flex;align-items:center;gap:10px;padding:16px 13px;white-space:nowrap}
.sbh b{display:block;font-size:14px;font-weight:800;color:#fff}
.sbh small{display:block;font-size:10px;opacity:.7}
.sbh>div:last-child,.sbi span,.sbg{transition:opacity .2s}
.sbn{flex:1;overflow-y:auto;padding:0 12px;scrollbar-width:none}
.sbn::-webkit-scrollbar{display:none}
.sbg{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#6ee7b799;padding:14px 8px 6px;white-space:nowrap}
.sbi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin:2px 0;border:0;border-radius:12px;background:none;color:inherit;font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.sbi:hover{background:#ffffff1a}
.sbi:focus-visible,.mbtn:focus-visible{outline:2px solid #5eead4;outline-offset:2px}
.sbi.on{background:#fff;color:#0f766e;box-shadow:0 6px 14px -6px #0006}
.ic{width:20px;height:20px;flex-shrink:0}
.sbf{padding:10px 12px;border-top:1px solid #ffffff1f}
.sbo{padding:0 12px 12px}
.sbi.out{color:#fecaca}.sbi.out:hover{background:#dc262666;color:#fff}
.sbf .ic{transition:transform .25s}
.mini .sbf .ic{transform:rotate(180deg)}
.mini .sbh>div:last-child,.mini .sbi span,.mini .sbg{opacity:0}
.mbtn{display:none;width:40px;height:40px;flex-shrink:0;align-items:center;justify-content:center;border-radius:12px;border:1px solid #ffffff40;background:#ffffff22;color:#fff;cursor:pointer}
.scrim{display:none}
@media(max-width:819px){
 .sb{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s .28s}
 .mini .sb{width:260px}
 .mini .sbh>div:last-child,.mini .sbi span,.mini .sbg{opacity:1}
 .open .sb{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:14px 0 40px -12px #000a}
 .scrim{display:block;position:fixed;inset:0;z-index:250;background:#0f172a80;backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
 .open .scrim{opacity:1;pointer-events:auto}
 .mbtn{display:flex}
 .sbf{display:none}
}
@media(prefers-reduced-motion:reduce){.sb,.scrim,.sbi,.sbf .ic{transition:none}}

/* ===== EMPTY STATE ===== */
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes fl{50%{transform:translateY(-5px)}}
.em{text-align:center;padding:22px 14px;animation:up .4s ease both}
.emi{position:relative;width:120px;height:120px;margin:0 auto 10px}
.emi svg{position:absolute;inset:0;width:100%;height:100%}
.emt{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;display:flex;align-items:center;justify-content:center;border-radius:18px;color:#fff;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 12px 22px -10px #0f766e;animation:fl 3s ease-in-out infinite}
.emt .ic{width:26px;height:26px}
.emh{font-size:16px;font-weight:800;color:var(--ink)}
.em p{max-width:380px;margin:6px auto 0;font-size:13px;line-height:1.6;color:#64748b}
.ems{text-align:left;max-width:310px;margin:10px auto 0;padding-left:20px}.ems li{margin:3px 0}
.ema{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.em.sm{padding:6px 8px}.sm .emi{width:76px;height:76px;margin-bottom:4px}.sm .emt{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:12px}.sm .emt .ic{width:18px;height:18px}.sm .emh{font-size:14px}.sm .ema{margin-top:10px}
@media(prefers-reduced-motion:reduce){.em,.emt{animation:none}}

/* ===== SKELETON LOADING ===== */
@keyframes shim{to{transform:translateX(100%)}}
.sk{position:relative;overflow:hidden;background:#e2e8f0;border-radius:8px}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#ffffffb3,transparent);animation:shim 1.4s ease-in-out infinite}
.sb .sk,.top .sk{background:#ffffff24}
.sb .sk::after,.top .sk::after{background:linear-gradient(90deg,transparent,#ffffff3d,transparent)}
@media(prefers-reduced-motion:reduce){.sk::after{animation:none}}

/* ===== BATANG BERJEJER PER KOMPONEN ===== */
.mq{height:130px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.mq i{flex:1 1 0;max-width:14px;border-radius:4px 4px 0 0;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms);transition:filter .15s}
.mc:hover .mq i{filter:brightness(1.15)}
@media(prefers-reduced-motion:reduce){.mq i{animation:none}}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}

.bk{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:12px;background:#fff}

 body>*:not(#print-layer){display:none!important}

}

<body>
<div id="app"></div>
<div id="print-layer"></div>
<div id="toast"></div>

<script>
/* ─── TERBILANG ─── */
function terbilang(n){
 if(!n||n===0)return"Nol Rupiah";n=Math.abs(Math.floor(n));
 const s=["","Satu","Dua","Tiga","Empat","Lima","Enam","Tujuh","Delapan","Sembilan"];
 function c(x){
  if(x===0)return"";if(x<10)return s[x];if(x===10)return"Sepuluh";if(x===11)return"Sebelas";
  if(x<20)return s[x-10]+" Belas";if(x<100)return s[Math.floor(x/10)]+" Puluh"+(x%10?" "+s[x%10]:"");
  if(x<200)return"Seratus"+(x%100?" "+c(x%100):"");if(x<1000)return s[Math.floor(x/100)]+" Ratus"+(x%100?" "+c(x%100):"");
  if(x<2000)return"Seribu"+(x%1000?" "+c(x%1000):"");if(x<1e6)return c(Math.floor(x/1000))+" Ribu"+(x%1000?" "+c(x%1000):"");
  if(x<1e9)return c(Math.floor(x/1e6))+" Juta"+(x%1e6?" "+c(x%1e6):"");
  return c(Math.floor(x/1e9))+" Miliar"+(x%1e9?" "+c(x%1e9):"");
 }return c(n)+" Rupiah";
}

/* ─── HELPERS ─── */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>"Rp "+(n||0).toLocaleString("id-ID");
const num=n=>(n||0).toLocaleString("id-ID");
const n2=v=>(v||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const tgl=s=>s?new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"}):"";
const tglS=s=>s?new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"";
const tglN=s=>new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});

/* No bukti belanja otomatis: 8/XI/2026. Urut per bulan menurut tanggal lunas bayar; tanggal sama -> yang lebih dulu diinput.
   Ganti bulan mulai lagi dari 1; tahun = tahun aktif. Dihitung ulang tiap simpan/hapus/muat, jadi selalu rapat dan berurutan. */
/* Format bebas dari Pengaturan, mis. "15/BOSP/XI/2026" atau "BKT-007/2026": angka pertama = nomor awal, angka Romawi = bulan,
   4 digit tahun = tahun aktif. Sisa teks dipakai apa adanya. Tanpa Romawi, nomor lanjut terus sepanjang tahun (tidak reset per bulan).
   shortcut: Romawi huruf besar saja yang dikenali sebagai bulan, cukup untuk format surat umum. */
const DEF_NO={t:'\u0003/\u0002/\u0001',n:1,w:0,m:0,y:null,r:true};
function parseNo(s){
 s=(s||'').trim();if(!s)return DEF_NO;
 let y=null,m=0,r=false;
 s=s.replace(/(?<!\d)(20\d\d)(?!\d)/,(_,v)=>(y=v,'\u0001'))
  .replace(/(?<![A-Za-z])(XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)(?![A-Za-z])/,(_,v)=>(r=true,m=ROM.indexOf(v),'\u0002'));
 const d=/\d+/.exec(s);if(!d)return null;
 return{t:s.replace(d[0],'\u0003'),n:+d[0],w:d[0].length>1&&d[0][0]==='0'?d[0].length:0,m,y,r};
}
function renumber(list){
 const cnt={},no={},T=parseNo(cfg.noAwal)||DEF_NO,key=m=>T.r?m:0;
 if(!T.y||T.y===String(yr))cnt[key(T.m)]=T.n-1;
 list.filter(t=>t.jenis==='kredit').sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||(a.dibuat||'').localeCompare(b.dibuat||'')||a.id.localeCompare(b.id))
  .forEach(t=>{const m=getMonth(t.tanggal),k=key(m),n=cnt[k]=(cnt[k]||0)+1;
   no[t.id]=T.t.replace('\u0001',()=>yr).replace('\u0002',()=>ROM[m]).replace('\u0003',()=>String(n).padStart(T.w,'0'))});

   Dana masuk  -> bank +
   Tarik dana  -> bank -, tunai +
   Belanja BKU -> tunai -
   Pajak: terima (tgl lunas bayar) tunai +, stor (tgl stor pajak) tunai -
   Urutan hari yang sama: masuk, tarik, belanja(+terima pajak), stor pajak */
const RANK={debet:0,tarik:1,kredit:2};
const sortTx=l=>[...l].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||RANK[a.jenis]-RANK[b.jenis]||a.id.localeCompare(b.id));
function run(list,s0){
 s0=s0||sa;let bank=s0.bank,tunai=s0.tunai,err=null,n=0;const rows=[],ev=[];
 list.forEach(t=>{
  ev.push({d:t.tanggal,r:RANK[t.jenis],id:t.id,s:0,k:'m',t});
  if(t.jenis==='kredit'&&t.pajak){
   ev.push({d:t.tanggal,r:2,id:t.id,s:1,k:'t',t});
   ev.push({d:t.pajak.tglStor||t.tanggal,r:3,id:t.id,s:2,k:'s',t});
  }
 });
 ev.sort((a,b)=>a.d.localeCompare(b.d)||a.r-b.r||a.id.localeCompare(b.id)||a.s-b.s);
 ev.forEach(e=>{
  const t=e.t;
  if(e.k==='m'){
   if(t.jenis==='debet')bank+=t.jumlah;
   else if(t.jenis==='tarik'){bank-=t.jumlah;tunai+=t.jumlah}
   else tunai-=t.jumlah;
   if(!err&&bank<0)err={t,k:'bank',v:bank};
   if(!err&&tunai<0)err={t,k:'tunai',v:tunai};
   rows.push({...t,rt:'main',no:++n,bank,tunai});
  }else{
   const p=t.pajak,lb=(fP(p.kode)||{}).label||'',ter=e.k==='t';
   tunai+=ter?p.jumlah:-p.jumlah;
   if(!err&&tunai<0)err={t,k:'tunai',v:tunai};
   rows.push({id:t.id+(ter?'_tp':'_ts'),parentId:t.id,rt:'tax',tk:e.k,pk:p.kode,pb:t.noBukti,tanggal:e.d,noBukti:'',uraian:`${ter?'Terima':'Setor'} Pajak ${lb} ${t.uraian}`,jenis:ter?'debet':'kredit',jumlah:p.jumlah,bank,tunai});
  }
 });
 return{rows,bank,tunai,err};
}

function bkuSheet(m,act){
 const prev=R.rows.filter(r=>getMonth(r.tanggal)<m),lp=prev[prev.length-1];
 const open=lp?lp.bank+lp.tunai:sa.bank+sa.tunai;
 const rows=R.rows.filter(r=>getMonth(r.tanggal)===m);
 const q=Math.ceil(m/3),ac=h=>act?`<td>${h||''}</td>`:'';
 let pen=open,peng=0;
 let body=`<tr><td>${tglN(`${yr}-${String(m).padStart(2,'0')}-01`)}</td><td></td><td></td><td>Sisa saldo bulan ${m===1?'Desember':MO[m-1]}</td><td class="r">${n2(open)}</td><td class="r">-</td><td class="r">${n2(open)}</td>${ac()}</tr>`;
 rows.forEach(r=>{
  const tax=r.rt==='tax';let a=0,b=0;
  if(r.jenis==='debet')a=r.jumlah;else if(r.jenis==='kredit')b=r.jumlah;else a=b=r.jumlah;

 });
 const last=rows.length?rows[rows.length-1]:(lp||{bank:sa.bank,tunai:sa.tunai});
 const tot2=last.bank+last.tunai;
 body+=`<tr class="j"><td></td><td></td><td></td><td>JUMLAH</td><td class="r">${n2(pen)}</td><td class="r">${n2(peng)}</td><td class="r">${n2(tot2)}</td>${ac()}</tr>`;

 </div>
 <table class="t"><thead><tr><th>Tanggal</th><th>No Kode</th><th>No Bukti</th><th>Uraian</th><th>Penerimaan</th><th>Pengeluaran</th><th>Saldo</th>${act?'<th></th>':''}</tr></thead><tbody>${body}</tbody></table>
 <table class="inf" style="margin-top:14px"><tr><td>${hari}, ${tglEnd} kas ditutup dengan</td><td class="r">${n2(tot2)}</td></tr><tr><td>saldo sebagai berikut :</td><td></td></tr>

function pjSheet(m){
 const tr=R.rows.filter(r=>r.rt==='tax'),sg=r=>r.tk==='t'?r.jumlah:-r.jumlah;
 const bef=r=>getMonth(r.tanggal)<m,cur=r=>getMonth(r.tanggal)===m;

 let body=`<tr><td>${tglN(`${yr}-${String(m).padStart(2,'0')}-01`)}</td><td></td><td>Sisa saldo pajak bulan ${m===1?'Desember':MO[m-1]}</td><td class="r">${n2(open)}</td><td class="r">-</td><td class="r">${n2(open)}</td></tr>`;
 rows.forEach(r=>{
  const a=r.tk==='t'?r.jumlah:0,b=r.tk==='s'?r.jumlah:0;pen+=a;peng+=b;sal+=a-b;
  body+=`<tr><td>${tglN(r.tanggal)}</td><td class="b">${esc(r.pb)}</td><td>${esc(r.uraian)}</td><td class="r">${a?n2(a):''}</td><td class="r">${b?n2(b):''}</td><td class="r">${n2(sal)}</td></tr>`;
 });
 body+=`<tr class="j"><td></td><td></td><td>JUMLAH</td><td class="r">${n2(pen)}</td><td class="r">${n2(peng)}</td><td class="r">${n2(sal)}</td></tr>`;

 <div class="b" style="margin-top:14px">Rekap Pajak Bulan ${MO[m]} ${yr}</div>
 <table class="t"><thead><tr><th>Jenis Pajak</th><th>Saldo Awal</th><th>Terima Pajak</th><th>Stor Pajak</th><th>Saldo Akhir</th></tr></thead><tbody>
  ${jr.map(x=>`<tr><td>${x[0]}</td>${cells(x)}</tr>`).join('')}
  <tr class="j"><td>JUMLAH</td>${cells([0,sm(1),sm(2),sm(3),sm(4)])}</tr></tbody></table>
 <table class="inf" style="margin-top:12px"><tr><td>${hari}, ${tglEnd} saldo pajak yang belum disetor</td><td class="r">${n2(sal)}</td></tr></table>

function doPrint(h,o){

 const l=$('print-layer');
 l.innerHTML=h+`<div class="no-print" style="text-align:center;margin:16px 0;display:flex;gap:10px;justify-content:center"><button class="btn" onclick="window.print()">🖨️ Cetak Sekarang</button><button class="btn gray" onclick="closePrint()">✕ Tutup</button></div>`;
 l.className='show';l.scrollTop=0;
}
function closePrint(){const l=$('print-layer');l.className='';l.innerHTML=''}

}

  return;
 }
 /* sessionStorage: login otomatis hilang saat tab/browser ditutup (refresh tetap masuk) */
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storage:sessionStorage}});
 let recov=false;sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')recov=true}); /* masuk lewat link reset password */

/* Tooltip grafik: hover di PC, ketuk di tablet. Isi dari atribut data-tip, "|" = baris baru */
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
function showTip(e){
 const el=e.target.closest&&e.target.closest('[data-tip]');
 if(!el){tip.style.display='none';return}
 tip.textContent=el.dataset.tip.replace(/\|/g,'\n');tip.style.display='block';
 const r=el.getBoundingClientRect(),w=tip.offsetWidth;
 tip.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';
 tip.style.top=Math.max(6,r.top-tip.offsetHeight-8)+'px';
}
document.addEventListener('pointerover',showTip);document.addEventListener('pointerdown',showTip);
</script>
