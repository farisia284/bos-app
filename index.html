<script>
/* ─── TERBILANG ─── */
function terbilang(n){
 if(!n||n===0)return"Nol Rupiah";n=Math.abs(Math.floor(n));
 const s=["","Satu","Dua","Tiga","Empat","Lima","Enam","Tujuh","Delapan","Sembilan"];
 function c(x){
  if(x===0)return"";if(x<10)return s[x];if(x===10)return"Sepuluh";if(x===11)return"Sebelas";
  if(x<20)return s[x-10]+" Belas";if(x<100)return s[Math.floor(x/10)]+" Puluh"+(x%10?" "+s[x%10]:"");
  if(x<200)return"Seratus"+(x%100?" "+c(x%100):"");if(x<1000)return s[Math.floor(x/100)]+" Ratus"+(x%100?" "+c(x%100):"");
  if(x<2000)return"Seribu"+(x%1000?" "+c(x%1000):"");if(x<1e6)return c(Math.floor(x/1000))+" Ribu"+(x%1000?" "+c(x%1000):"");
  if(x<1e9)return c(Math.floor(x/1e6))+" Juta"+(x%1e6?" "+c(x%1e6):"");
  return c(Math.floor(x/1e9))+" Miliar"+(x%1e9?" "+c(x%1e9):"");
 }return c(n)+" Rupiah";
}

/* ─── HELPERS ─── */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>"Rp "+(n||0).toLocaleString("id-ID");
const num=n=>(n||0).toLocaleString("id-ID");
const n2=v=>(v||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const tgl=s=>s?new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"}):"";
const tglS=s=>s?new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"";
const tglN=s=>new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const cleanNum=s=>parseFloat(String(s).replace(/\./g,"").replace(",","."))||0;
const getMonth=s=>s?new Date(s+"T00:00:00").getMonth()+1:0;
const MO=["","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const ROM=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const TW=["","Satu","Dua","Tiga","Empat"];
const logoImg=s=>s?`<img src="${s}" style="width:80px;height:80px;object-fit:contain">`:'<div style="width:80px;height:80px"></div>';

const KOMP=[
 {kode:"1",nama:"Honorarium Non-PNS",full:"Honorarium NON PNS",color:"#7C3AED"},
 {kode:"2",nama:"Alat Tulis Kantor",full:"Belanja Alat Tulis Kantor",color:"#2563EB"},
 {kode:"3",nama:"Cetak & Penggandaan",full:"Belanja Cetak dan Penggandaan",color:"#0891B2"},
 {kode:"4",nama:"Jaskom",full:"Belanja Jasa Komunikasi (Jaskom)",color:"#65A30D"},
 {kode:"5",nama:"Pemeliharaan",full:"Belanja Pemeliharaan",color:"#D97706"},
 {kode:"6",nama:"Perjalanan Dinas",full:"Belanja Perjalanan Dinas",color:"#EA580C"},
 {kode:"7",nama:"Belanja Lainnya",full:"Belanja Lainnya",color:"#DC2626"},
 {kode:"8",nama:"Belanja Modal",full:"Belanja Modal",color:"#BE185D"},
];
const fK=k=>KOMP.find(x=>x.kode===k);
const PAJAK=[{kode:"pph21",label:"PPh 21",persen:5},{kode:"pph23",label:"PPh 23",persen:4},{kode:"ppn",label:"PPN",persen:12}];
const fP=k=>PAJAK.find(x=>x.kode===k);
const JL={pph21:'Pph 21',pph23:'Pph 23',ppn:'PPn'};

const DEF_CFG={namaSekolah:"SDN Kalisari",npsn:"20208284",alamat:"Jl. Kalisari Raya No. 1",
 kecamatan:"Pasar Rebo",kota:"Jakarta Timur",tempat:"Kalisari",kepsek:"",nipKepsek:"",
 kopPemda:"PEMERINTAH KABUPATEN BATANG",kopSekolah:"SD NEGERI KALISARI REBAN",email:"sdnkalisarireban@gmail.com",
 namaLengkap:"SEKOLAH DASAR NEGERI KALISARI",alamatRekap:"Alamat : Desa Kalisari Kecamatan Reban Kabupaten Batang",logoKiri:"",logoKanan:"",
 bendahara:"Salman Alfarisi, S.Pd.",nipBendahara:"",
 pagu:100000000,guruList:[{id:"g1",nama:"Salman Alfarisi, S.Pd.",nip:""},{id:"g2",nama:"Siti Rahayu, S.Pd.",nip:""}]};

/* ═════════ PENYIMPANAN ONLINE (Supabase) ═════════
   Semua data disimpan sebagai pasangan kunci -> nilai di tabel bos_kv (satu baris per kunci per akun).
   DB = salinan di memori. ld() membaca dari DB, sv() menulis ke DB lalu dikirim ke server (ditunda 0,6 detik). */
const SB_URL='https://krmaunydkvkmdfrbckgi.supabase.co',SB_KEY='sb_publishable_bjbwDH_CVDkAxOAP0_103w_cC8YzYGf';
let sb=null,user=null,DB={},pend={},ver=0,sync='ok',sTimer=null;
const SYN={ok:'☁️ Tersimpan',wait:'⏳ Menyimpan…',err:'⚠️ Gagal simpan, mencoba lagi…'};
function setSync(s){sync=s;const e=$('sync');if(e)e.textContent=SYN[s]}
const clone=v=>JSON.parse(JSON.stringify(v));
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,i)=>(o[i]=x[i],o),{}):x);
const ld=k=>DB[k]===undefined?null:clone(DB[k]);
const sv=(k,v)=>{DB[k]=clone(v);pend[k]=++ver;setSync('wait');clearTimeout(sTimer);sTimer=setTimeout(flush,600)};
async function flush(){
 const keys=Object.keys(pend);if(!keys.length||!user)return;
 const sent={},rows=keys.map(k=>{sent[k]=pend[k];return{user_id:user.id,key:k,value:DB[k],updated_at:new Date().toISOString()}});
 const {error}=await sb.from('bos_kv').upsert(rows,{onConflict:'user_id,key'});
 if(error){setSync('err');clearTimeout(sTimer);sTimer=setTimeout(flush,5000);return}
 keys.forEach(k=>{if(pend[k]===sent[k])delete pend[k]});
 if(Object.keys(pend).length){clearTimeout(sTimer);sTimer=setTimeout(flush,300)}else setSync('ok');
}
const TXK=y=>'bos4-tx-'+y, SAK=y=>'bos4-sa-'+y, CFGK='bos4-cfg', YK='bos4-years';

/* ─── LOGIN ─── */
function showLogin(msg,email){
 $('app').innerHTML=`<div style="max-width:380px;margin:50px auto;padding:0 14px"><div class="card">
  <div style="text-align:center;font-size:36px">📒</div><div class="ct" style="text-align:center;font-size:16px">Aplikasi BOS Digital</div>
  ${msg?`<div class="info" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">${esc(msg)}</div>`:''}
  <label>Email</label><input id="lg-e" type="email" autocomplete="username" value="${esc(email||'')}">
  <label>Password</label><input id="lg-p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Masuk</button></div></div>`;
}
async function doLogin(){
 const email=$('lg-e').value.trim(),password=$('lg-p').value;
 if(!email||!password){showLogin('Isi email dan password',email);return}
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){showLogin('Email atau password salah',email);return}
 user=data.user;await start();
}
async function logout(){
 if(Object.keys(pend).length&&!confirm('Masih ada data yang belum tersimpan online. Tetap keluar?'))return;
 await sb.auth.signOut();user=null;DB={};pend={};showLogin();
}
async function fetchAll(){
 const {data,error}=await sb.from('bos_kv').select('key,value');
 if(error)return null;
 const o={};data.forEach(r=>o[r.key]=r.value);return o;
}
/* Data lama di browser ini (versi sebelumnya) dipindah ke online satu kali, hanya jika server masih kosong */
async function migrateLocal(){
 if(Object.keys(DB).length)return;
 let ks=[];try{ks=Object.keys(localStorage).filter(k=>k.startsWith('bos4-'))}catch(e){}
 if(!ks.length||!confirm(`Ditemukan ${ks.length} data BOS lama di browser ini. Pindahkan ke online?`))return;
 ks.forEach(k=>{try{sv(k,JSON.parse(localStorage.getItem(k)))}catch(e){}});
 await flush();
}
async function start(){
 $('app').innerHTML='<div style="text-align:center;padding:60px;color:#166534;font-weight:700">📒 Memuat data BOS…</div>';
 const o=await fetchAll();
 if(!o){showLogin('Gagal memuat data. Periksa internet atau proyek Supabase (mungkin nonaktif).');return}
 DB=o;pend={};
 await migrateLocal();
 cfg={...DEF_CFG,...(ld(CFGK)||{})};
 loadYear(String(new Date().getFullYear()));
 newForm();render();
 if(!window._ev){window._ev=1;
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  addEventListener('beforeunload',e=>{if(Object.keys(pend).length){e.preventDefault();e.returnValue=''}});
 }
}
/* Saat aplikasi dibuka kembali, ambil data terbaru jika ada perubahan dari perangkat lain */
async function refresh(){
 if(!user||Object.keys(pend).length)return;
 const o=await fetchAll();if(!o||Object.keys(pend).length)return;
 let ch=false;new Set([...Object.keys(o),...Object.keys(DB)]).forEach(k=>{if(canon(o[k])!==canon(DB[k]))ch=true});
 if(!ch)return;
 DB=o;cfg={...DEF_CFG,...(ld(CFGK)||{})};loadYear(yr);render();toast('🔄 Data diperbarui dari perangkat lain');
}
function exportDb(){
 const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=`cadangan-bos-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function importDb(el){
 const f=el.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{
  let o,ks;
  try{o=JSON.parse(rd.result);ks=Object.keys(o).filter(k=>k.startsWith('bos4-'));if(!ks.length)throw 0}catch(e){toast('⚠️ File cadangan tidak valid');return}
  if(!confirm(`Pulihkan ${ks.length} data dari cadangan? Data dengan nama sama akan ditimpa.`))return;
  ks.forEach(k=>sv(k,o[k]));cfg={...DEF_CFG,...(ld(CFGK)||{})};loadYear(yr);render();toast('✅ Cadangan dipulihkan');
 };
 rd.readAsText(f);
}

/* ─── STATE ─── */
let yr,cfg,tx=[],sa={bank:0,tunai:0},R={rows:[]};
let tab='dashboard',editId=null,delId=null,cfgD=null,F;
const nowM=String(new Date().getMonth()+1);
let bkuM=nowM,pjM=nowM,pMo=nowM,rkT=+nowM<=6?'1':'2',rkTgl='';

/* Daftar tahun: tahun lalu, ini, depan + tahun yang sudah ada datanya + tahun yang ditambah operator */
function yearList(){
 const y0=new Date().getFullYear(),s=new Set([...(ld(YK)||[]),+yr,y0-1,y0,y0+1]);
 Object.keys(DB).forEach(k=>{const m=k.match(/^bos4-tx-(\d{4})$/);if(m)s.add(+m[1])});
 return[...s].sort();
}

const fGuru=id=>(cfg.guruList||[]).find(g=>g.id===id);
/* tanggal = LUNAS BAYAR (BKU, A2, SP, = tanggal terima pajak). tglTrx = tanggal transaksi (A2). pajak.tglStor = tanggal stor pajak */
function initForm(){return{tanggal:today(),tglTrx:today(),tglStor:today(),ntpn:'',noBukti:'',kode:'',uraian:'',komponen:'2',jenis:'kredit',jumlah:'',ket:'',guruId:'',pajakOn:false,pajakKode:'pph23'}}
/* No bukti otomatis hanya untuk belanja: 1/BOSP/V/2026 (urut per bulan) */
function autoNo(){
 if(editId)return;
 if(F.jenis!=='kredit'){F.noBukti='';return}
 const m=getMonth(F.tanggal)||new Date().getMonth()+1;
 const n=tx.filter(t=>t.jenis==='kredit'&&getMonth(t.tanggal)===m).length+1;
 F.noBukti=`${n}/BOSP/${ROM[m]}/${yr}`;
}
function newForm(){F=initForm();autoNo()}
function loadYear(y){yr=y;tx=ld(TXK(y))||[];sa=ld(SAK(y))||{bank:0,tunai:0}}

/* ─── HITUNG SALDO ───
   Dana masuk  -> bank +
   Tarik dana  -> bank -, tunai +
   Belanja BKU -> tunai -
   Pajak: terima (tgl lunas bayar) tunai +, stor (tgl stor pajak) tunai -
   Urutan hari yang sama: masuk, tarik, belanja(+terima pajak), stor pajak */
const RANK={debet:0,tarik:1,kredit:2};
const sortTx=l=>[...l].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||RANK[a.jenis]-RANK[b.jenis]||a.id.localeCompare(b.id));
function run(list,s0){
 s0=s0||sa;let bank=s0.bank,tunai=s0.tunai,err=null,n=0;const rows=[],ev=[];
 list.forEach(t=>{
  ev.push({d:t.tanggal,r:RANK[t.jenis],id:t.id,s:0,k:'m',t});
  if(t.jenis==='kredit'&&t.pajak){
   ev.push({d:t.tanggal,r:2,id:t.id,s:1,k:'t',t});
   ev.push({d:t.pajak.tglStor||t.tanggal,r:3,id:t.id,s:2,k:'s',t});
  }
 });
 ev.sort((a,b)=>a.d.localeCompare(b.d)||a.r-b.r||a.id.localeCompare(b.id)||a.s-b.s);
 ev.forEach(e=>{
  const t=e.t;
  if(e.k==='m'){
   if(t.jenis==='debet')bank+=t.jumlah;
   else if(t.jenis==='tarik'){bank-=t.jumlah;tunai+=t.jumlah}
   else tunai-=t.jumlah;
   if(!err&&bank<0)err={t,k:'bank',v:bank};
   if(!err&&tunai<0)err={t,k:'tunai',v:tunai};
   rows.push({...t,rt:'main',no:++n,bank,tunai});
  }else{
   const p=t.pajak,lb=(fP(p.kode)||{}).label||'',ter=e.k==='t';
   tunai+=ter?p.jumlah:-p.jumlah;
   if(!err&&tunai<0)err={t,k:'tunai',v:tunai};
   rows.push({id:t.id+(ter?'_tp':'_ts'),parentId:t.id,rt:'tax',tk:e.k,pk:p.kode,pb:t.noBukti,tanggal:e.d,noBukti:'',uraian:`${ter?'Terima':'Setor'} Pajak ${lb} ${t.uraian}`,jenis:ter?'debet':'kredit',jumlah:p.jumlah,bank,tunai});
  }
 });
 return{rows,bank,tunai,err};
}
function tot(){
 const s=j=>tx.filter(t=>t.jenis===j).reduce((a,t)=>a+t.jumlah,0);
 const masuk=s('debet'),tarik=s('tarik'),real=s('kredit');
 return{masuk,tarik,real,sisa:masuk-real,bank:sa.bank+masuk-tarik,tunai:sa.tunai+tarik-real};
}

 const tr=R.rows.filter(r=>r.rt==='tax'),sg=r=>r.tk==='t'?r.jumlah:-r.jumlah;
 const bef=r=>getMonth(r.tanggal)<m,cur=r=>getMonth(r.tanggal)===m;
 const open=tr.filter(bef).reduce((s,r)=>s+sg(r),0),rows=tr.filter(cur);
 let sal=open,pen=open,peng=0;
 let body=`<tr><td>${tglN(`${yr}-${String(m).padStart(2,'0')}-01`)}</td><td></td><td>Sisa saldo pajak bulan ${m===1?'Desember':MO[m-1]}</td><td class="r">${n2(open)}</td><td class="r">-</td><td class="r">${n2(open)}</td></tr>`;
